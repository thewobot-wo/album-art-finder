<svg width="1200" height="280" viewBox="0 0 1200 280" xmlns="http://www.w3.org/2000/svg">
  <!-- Yellow background (no border - matches 2016 Playbill redesign) -->
  <rect x="0" y="0" width="1200" height="280" fill="#fceb00"/>

  <!-- PLAYART text - condensed, tall, theatrical -->
  <text
    x="600"
    y="200"
    font-family="Impact, 'Arial Narrow', Arial, sans-serif"
    font-size="140"
    font-weight="900"
    text-anchor="middle"
    fill="#000000"
    letter-spacing="12"
    style="font-stretch: condensed;">
    PLAYART
  </text>

  <!-- Subtle tagline -->
  <text
    x="600"
    y="240"
    font-family="Arial, sans-serif"
    font-size="18"
    font-weight="700"
    text-anchor="middle"
    fill="#000000"
    letter-spacing="4">
    ALBUM ART FINDER
  </text>
</svg>
